    body { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Background */
    .hero-bg {
      background:
        radial-gradient(ellipse 60% 50% at 15% 40%, rgba(6,182,212,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 60%, rgba(139,92,246,0.12) 0%, transparent 60%),

    }
    .page-bg { background: #020617; }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Stat cards */
    .stat-card {
      background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(139,92,246,0.08));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    /* Project cards */
    .card {
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(255,255,255,0.07);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      border-color: rgba(6,182,212,0.35);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(6,182,212,0.08);
    }

    /* Badges */
    .badge-open    { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .badge-partial { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .badge-closed  { background: rgba(239,68,68,0.08);  color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }

    /* Filter buttons */
    .filter-btn {
      color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      transition: all 0.15s;
      cursor: pointer;
    }
    .filter-btn:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); }
    .filter-btn.active {
      background: rgba(6,182,212,0.15);
      color: #22d3ee;
      border-color: rgba(6,182,212,0.4);
    }

    /* Language toggle */
    .lang-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.1); color: white; }
    .lang-btn.active { background: rgba(6,182,212,0.18); border-color: rgba(6,182,212,0.5); color: #22d3ee; }

    /* Search */
    .search-input {
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: rgba(6,182,212,0.5);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.1);
    }
    .search-input::placeholder { color: rgba(255,255,255,0.25); }

    /* Animations */
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes countUp { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
    .card { animation: fadeUp 0.35s ease both; }
    .stat-num { animation: countUp 0.5s ease both; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.35); border-radius: 4px; }

    /* Sticky filter section */
    .sticky-filters {
      position: sticky;
      top: 64px;
      z-index: 40;
      background: rgba(2,6,23,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Tag */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }

    /* Link */
    .proj-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: #22d3ee;
      transition: color 0.15s;
      text-decoration: none;
    }
    .proj-link:hover { color: #67e8f9; }

    .nav-glass {
      background: rgba(2,6,23,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

</head>

    // ================================================================
    //  LANGUAGE SWITCHING
    // ================================================================
    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.title = lang === 'en'
        ? 'OpenClaw Pool — The Complete Claw Ecosystem Map'
        : 'OpenClaw Pool — Claw 家族生态系统全景图';

      document.getElementById('btn-zh').className =
        `lang-btn ${lang==='zh'?'active':''} px-3 py-1.5 text-sm font-semibold`;
      document.getElementById('btn-en').className =
        `lang-btn ${lang==='en'?'active':''} px-3 py-1.5 text-sm font-semibold`;
      document.getElementById('btn-zh').style.cssText = 'border:none;border-radius:0';
      document.getElementById('btn-en').style.cssText = 'border:none;border-left:1px solid rgba(255,255,255,0.1);border-radius:0';

      // Swap static i18n text nodes
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
      });

      // Refresh dynamic filter button labels
      const t = i18n[lang];
      [
        ['cat-all','catAll'],['cat-foundation','catFoundation'],['cat-lightweight','catLightweight'],
        ['cat-enterprise','catEnterprise'],['cat-community','catCommunity'],['cat-industry','catIndustry'],
        ['cat-iot','catIot'],['cat-desktop','catDesktop'],['cat-research','catResearch'],
        ['oss-all','filterAll'],['oss-open','filterOpen'],['oss-partial','filterPartial'],['oss-closed','filterClosed'],
      ].forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el && t[key]) el.textContent = t[key];
      });

      applyFilters();
    }

    // ================================================================
    //  FILTERS
    // ================================================================
    function toggleOss(val) {
      currentOss = val;
      ['all','open','partial','closed'].forEach(v =>
        document.getElementById(`oss-${v}`).classList.toggle('active', v === val));
      applyFilters();
    }

    function toggleCat(val) {
      currentCat = val;
      ['all','foundation','lightweight','enterprise','community','industry','iot','desktop','research'].forEach(v => {
        const el = document.getElementById(`cat-${v}`);
        if (el) el.classList.toggle('active', v === val);
      });
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = projects.filter(p => {
        if (currentOss !== 'all' && p.oss !== currentOss) return false;
        if (currentCat !== 'all' && p.cat !== currentCat) return false;
        if (query) {
          const name = (currentLang === 'zh' ? p.name : (p.nameEn || p.name)).toLowerCase();
          const team = (currentLang === 'zh' ? p.team : (p.teamEn || p.team)).toLowerCase();
          const desc = (currentLang === 'zh' ? p.descZh : p.descEn).toLowerCase();
          const tags = (p.tags || []).join(' ').toLowerCase();
          if (!name.includes(query) && !team.includes(query) && !desc.includes(query) && !tags.includes(query)) return false;
        }
        return true;
      });
      renderCards(filtered);
    }

      const t = i18n[currentLang];
      const map = { open:'badge-open', partial:'badge-partial', closed:'badge-closed' };
      const labels = { open: t.openBadge, partial: t.partialBadge, closed: t.closedBadge };
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${map[oss]}">${OSS_ICON[oss]} ${labels[oss]}</span>`;
    }

    function catBadge(cat) {
      const label = (i18n[currentLang].catLabels || {})[cat] || cat;
      return `<span class="tag">${label}</span>`;
    }

    function renderCards(list = projects) {
      const grid       = document.getElementById('cards-grid');
      const noResults  = document.getElementById('no-results');
      const countEl    = document.getElementById('count-num');
      const t          = i18n[currentLang];

      countEl.textContent = list.length;

      if (list.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      grid.innerHTML = list.map((p, i) => {
        const name  = currentLang === 'zh' ? p.name  : (p.nameEn  || p.name);
        const team  = currentLang === 'zh' ? p.team  : (p.teamEn  || p.team);
        const desc  = currentLang === 'zh' ? p.descZh : p.descEn;
        const isGH  = p.url && p.url.includes('github.com');
        const linkLabel = isGH ? t.viewGitHub : t.visitSite;
        const linkIcon  = isGH ? GH_ICON : EXT_ICON;
        const linkBtn   = p.url
          ? `<a href="${p.url}" target="_blank" rel="noopener" class="proj-link mt-auto pt-1">${linkIcon} ${linkLabel}</a>`
          : '';

        const tagBadges = (p.tags || [])
          .map(tag => `<span class="tag">${tag}</span>`)
          .join('');

        return `
          <article class="card rounded-2xl p-5 flex flex-col gap-3" style="animation-delay:${(i%9)*25}ms">
            <div class="flex items-start justify-between gap-2">
              <h2 class="font-bold text-white text-[15px] leading-snug">${name}</h2>
              ${ossBadge(p.oss)}
            </div>
            <p class="text-gray-500 text-xs font-medium tracking-wide uppercase">${team}</p>
            <p class="text-gray-400 text-sm leading-relaxed flex-1">${desc}</p>
            <div class="flex flex-wrap gap-1.5">
              ${catBadge(p.cat)}
              ${p.license ? `<span class="tag mono">${p.license}</span>` : ''}
              ${tagBadges}
            </div>
            ${linkBtn}
          </article>`;
      }).join('');
    }

    // ================================================================
    //  INIT  (default: English)
    // ================================================================
    setLang('en');
  </script>
</body>
</html>
